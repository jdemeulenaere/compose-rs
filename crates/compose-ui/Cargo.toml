[package]
name = "compose-ui"
description = "The UI layer of compose-rs: layout nodes, modifiers, layout, drawing, input, semantics."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true
compose-runtime.workspace = true
compose-lifecycle.workspace = true
compose-navigation-event.workspace = true
# The `Stream` trait an interaction source's collector is (D1050), as the runtime's flows will be.
futures-core = { version = "0.3", default-features = false, features = ["alloc"] }
smallvec = { version = "1.13", features = ["const_new", "union"] }
unicode-bidi = "0.3"
unicode-general-category = "1"
unicode-segmentation = "1"

[lints]
workspace = true
