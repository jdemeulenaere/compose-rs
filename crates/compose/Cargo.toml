[package]
name = "compose"
description = "compose-rs: Jetpack Compose's model in Rust. Facade over the compose-* crates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true
compose-runtime.workspace = true
compose-ui.workspace = true
compose-foundation.workspace = true
compose-material3.workspace = true
compose-animation.workspace = true
compose-navigation.workspace = true
compose-test = { workspace = true, optional = true }
compose-desktop = { workspace = true, optional = true }

[features]
# `compose::test`: the test rule, for tests (as a dev-dependency feature).
test = ["dep:compose-test"]
# `compose::desktop`: run_app, a winit window drawn with Skia.
desktop = ["dep:compose-desktop"]

[dev-dependencies]
trybuild = "1"
