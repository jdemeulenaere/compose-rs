[package]
name = "compose-animation"
description = "compose-rs's animations, as Compose's androidx.compose.animation(.core): Animatable, tween and spring specs, easings, animate*AsState, infinite transitions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
compose-runtime.workspace = true
compose-ui.workspace = true

[dev-dependencies]
compose-test.workspace = true
# For tests/suite only. compose-foundation depends on compose-animation (D820), so this crate's
# own unit tests (`--lib`) link a second compose-animation through it: they must not use
# compose-foundation, whose types would be the other copy's (D826).
compose-foundation.workspace = true

[lints]
workspace = true
