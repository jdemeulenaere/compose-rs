[workspace]
resolver = "3"
members = ["crates/compose", "crates/compose-macros", "crates/compose-runtime", "crates/compose-ui", "crates/compose-foundation", "crates/compose-material3", "crates/compose-animation", "crates/compose-navigation", "crates/compose-test", "crates/compose-skia", "crates/compose-desktop", "crates/compose-android", "examples/counter", "examples/todo", "examples/gallery", "examples/android-demo", "examples/feed", "examples/guide", "benchmarks"]
# The benchmarks pull in criterion; keep them out of a plain `cargo build` / `cargo test`.
default-members = ["crates/compose", "crates/compose-macros", "crates/compose-runtime", "crates/compose-ui", "crates/compose-foundation", "crates/compose-material3", "crates/compose-animation", "crates/compose-navigation", "crates/compose-test", "crates/compose-android", "examples/counter", "examples/todo", "examples/gallery", "examples/guide"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

# A dropped future (`scroll_by` instead of `dispatch_raw_delta`, D853) or an ignored result is an
# error everywhere in the workspace.
[workspace.lints.rust]
unused_must_use = "deny"

[workspace.dependencies]
compose-macros = { path = "crates/compose-macros" }
compose-runtime = { path = "crates/compose-runtime" }
compose-ui = { path = "crates/compose-ui" }
compose-test = { path = "crates/compose-test" }
compose-skia = { path = "crates/compose-skia" }
compose-desktop = { path = "crates/compose-desktop" }
compose-android = { path = "crates/compose-android" }
compose-foundation = { path = "crates/compose-foundation" }
compose-material3 = { path = "crates/compose-material3" }
compose-animation = { path = "crates/compose-animation" }
compose-navigation = { path = "crates/compose-navigation" }
# The logging facade (D280): what compose-rs logs through, and apps too.
log = "0.4"

# Fast edit-build loop (docs/08-fast-builds.md).
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
debug = false

# `package."*"` also applies to build scripts' dependencies, which only run during the build:
# compiling skia-bindings' build tools (bindgen, regex, clang-sys, cc, ...) at opt-level 1 made a
# clean debug build slower than a release build. Back to opt-level 0, as a release build compiles
# them. syn, quote and proc-macro2 stay at 1: they run in every expansion of #[composable].
[profile.dev.package.prettyplease]
opt-level = 0
[profile.dev.package.bindgen]
opt-level = 0
[profile.dev.package.clang-sys]
opt-level = 0
[profile.dev.package.regex-automata]
opt-level = 0
[profile.dev.package.regex-syntax]
opt-level = 0
[profile.dev.package.aho-corasick]
opt-level = 0
[profile.dev.package.cc]
opt-level = 0
[profile.dev.package.toml]
opt-level = 0
[profile.dev.package.serde_json]
opt-level = 0
[profile.dev.package.tar]
opt-level = 0
[profile.dev.package.nom]
opt-level = 0
[profile.dev.package.cexpr]
opt-level = 0

[profile.bench]
debug = "line-tables-only"

# The Android library (android/build-rust.sh; D361, docs/14's #4b). Debuggable variants build
# with `android`: release, but panics abort where they happen, after the panic hook logs them to
# logcat. A panic reaching a JNI function aborts anyway; one that unwinding would let go aborts
# too, in debug builds as in release ones: in a cancelled task's background work, a pool thread's
# drop or wake, an app's own thread, or under an app's own `catch_unwind`. Desktop and tests keep
# unwinding. With LTO, abort takes 0.28 MB off the library.
[profile.android]
inherits = "release"
panic = "abort"

# The other (release) variants: also one codegen unit and fat LTO (0.21 MB smaller without abort,
# the Rust frame about 2 % shorter), which make a framework edit rebuild the library in about 5 s
# instead of 2.
[profile.android-release]
inherits = "android"
lto = "fat"
codegen-units = 1
