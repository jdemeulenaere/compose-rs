[workspace]
resolver = "3"
members = ["crates/compose", "crates/compose-macros", "crates/compose-runtime", "crates/compose-ui", "crates/compose-foundation", "crates/compose-material3", "crates/compose-test", "examples/counter", "examples/todo", "benchmarks"]
# The benchmarks pull in criterion; keep them out of a plain `cargo build` / `cargo test`.
default-members = ["crates/compose", "crates/compose-macros", "crates/compose-runtime", "crates/compose-ui", "crates/compose-foundation", "crates/compose-material3", "crates/compose-test", "examples/counter", "examples/todo"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
compose-macros = { path = "crates/compose-macros" }
compose-runtime = { path = "crates/compose-runtime" }
compose-ui = { path = "crates/compose-ui" }
compose-test = { path = "crates/compose-test" }
compose-foundation = { path = "crates/compose-foundation" }
compose-material3 = { path = "crates/compose-material3" }

# Fast edit-build loop (docs/08-fast-builds.md).
[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.bench]
debug = "line-tables-only"
