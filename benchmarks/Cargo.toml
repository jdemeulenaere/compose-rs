[package]
name = "compose-benchmarks"
description = "Runtime benchmarks of compose-rs (criterion). Not a default member: run with `cargo bench -p compose-benchmarks`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
compose-runtime.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
compose = { path = "../crates/compose", features = ["test"] }
counter = { path = "../examples/counter" }
todo = { path = "../examples/todo" }
compose-skia = { path = "../crates/compose-skia" }

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "ui"
harness = false
