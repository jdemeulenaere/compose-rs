[package]
name = "compose-benchmarks"
description = "Runtime benchmarks of compose-rs (criterion). Not a default member: run with `cargo bench -p compose-benchmarks`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
compose-runtime.workspace = true

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "runtime"
harness = false
