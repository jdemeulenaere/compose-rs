[package]
name = "counter"
description = "The counter app, as Compose's first sample."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The desktop binary (`cargo run -p counter`); off for embedding the library (Android).
default = ["desktop"]
desktop = ["compose/desktop"]

[[bin]]
name = "counter"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
compose = { path = "../../crates/compose" }

[dev-dependencies]
compose = { path = "../../crates/compose", features = ["test"] }
