[package]
name = "gallery"
description = "A tour of the toolkit: Material components, lazy lists, animations and navigation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The desktop binary (`cargo run -p gallery`); off for embedding the library (Android).
default = ["desktop"]
desktop = ["compose/desktop"]

[[bin]]
name = "gallery"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
compose = { path = "../../crates/compose" }

[dev-dependencies]
compose = { path = "../../crates/compose", features = ["test"] }

[lints]
workspace = true
