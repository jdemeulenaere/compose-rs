[package]
name = "guide"
description = "The samples of docs/guide, compiled and tested: the guide quotes these files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The desktop binary (`cargo run -p guide`); off for embedding the library (Android).
default = ["desktop"]
desktop = ["compose/desktop"]

[[bin]]
name = "guide"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
compose = { path = "../../crates/compose" }
compose-android.workspace = true

[dev-dependencies]
compose = { path = "../../crates/compose", features = ["test"] }
